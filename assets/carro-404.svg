<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="t">
  <title id="t">Carro amarelo com pane: a roda dianteira saiu rolando, sai fumaça do capô e uma placa mostra PAG-404</title>
  <style>
    .roda-solta { animation: rola 3.6s cubic-bezier(.3,.1,.6,1) infinite; transform-box: view-box; }
    .roda-solta .gira { animation: gira 3.6s linear infinite; transform-box: fill-box; transform-origin: center; }
    .carro { animation: treme 1.8s ease-in-out infinite; transform-box: view-box; transform-origin: 196px 248px; }
    .fumaca circle { animation: sobe 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
    .fumaca circle:nth-child(2) { animation-delay: .8s; }
    .fumaca circle:nth-child(3) { animation-delay: 1.6s; }
    .faixas { animation: estrada 1.2s linear infinite; }
    .pisca { animation: pisca 1s steps(2, start) infinite; }
    @keyframes rola { 0% { transform: translateX(0); opacity: 1; } 75% { opacity: 1; } 100% { transform: translateX(330px); opacity: 0; } }
    @keyframes gira { to { transform: rotate(720deg); } }
    @keyframes treme { 0%, 100% { transform: translateY(4px) rotate(4deg); } 50% { transform: translateY(4px) rotate(3.4deg); } }
    @keyframes sobe { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 15% { opacity: .85; } 100% { transform: translate(-26px, -70px) scale(1.6); opacity: 0; } }
    @keyframes estrada { to { transform: translateX(-80px); } }
    @keyframes pisca { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      .roda-solta, .roda-solta .gira, .carro, .fumaca circle, .faixas, .pisca { animation: none; }
      .roda-solta { transform: translateX(150px); }
      .fumaca circle { opacity: .6; }
    }
  </style>

  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff"/>
      <stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="pontas"><rect width="680" height="320" fill="url(#fade)"/></mask>
  </defs>

  <!-- estrada -->
  <g mask="url(#pontas)">
  <rect x="0" y="252" width="680" height="68" fill="#23262d"/>
  <rect x="0" y="248" width="680" height="6" fill="#3a3d44"/>
  <g class="faixas" fill="#f5c400">
    <rect x="0" y="282" width="44" height="7" rx="2"/><rect x="80" y="282" width="44" height="7" rx="2"/>
    <rect x="160" y="282" width="44" height="7" rx="2"/><rect x="240" y="282" width="44" height="7" rx="2"/>
    <rect x="320" y="282" width="44" height="7" rx="2"/><rect x="400" y="282" width="44" height="7" rx="2"/>
    <rect x="480" y="282" width="44" height="7" rx="2"/><rect x="560" y="282" width="44" height="7" rx="2"/>
    <rect x="640" y="282" width="44" height="7" rx="2"/><rect x="720" y="282" width="44" height="7" rx="2"/>
  </g>
  </g>

  <!-- placa PAG-404 num poste -->
  <rect x="566" y="128" width="8" height="122" fill="#6b707a"/>
  <g transform="translate(510 92)">
    <rect width="120" height="56" rx="6" fill="#fff" stroke="#16181d" stroke-width="3"/>
    <rect x="1.5" y="1.5" width="117" height="13" rx="4" fill="#1f3fa8"/>
    <text x="60" y="11.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="3" fill="#fff">BRASIL</text>
    <text x="60" y="46" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="2" fill="#16181d">PAG-404</text>
  </g>

  <!-- cone -->
  <g transform="translate(468 206)">
    <path d="M16 0 L30 44 H2 Z" fill="#f97316"/>
    <path d="M10 18 H22 L25 28 H7 Z" fill="#fff"/>
    <rect x="-4" y="42" width="40" height="6" rx="2" fill="#16181d"/>
  </g>

  <!-- macaco no chão, segurando a frente -->
  <g transform="translate(334 220)">
    <rect x="0" y="20" width="34" height="9" rx="2" fill="#3a3d44"/>
    <path d="M5 20 L17 5 L29 20" fill="none" stroke="#f5c400" stroke-width="5" stroke-linejoin="round"/>
    <rect x="9" y="0" width="16" height="6" rx="2" fill="#3a3d44"/>
  </g>

  <!-- carro inclinado (a frente caiu sem a roda) -->
  <g class="carro">
    <!-- carroceria -->
    <path d="M196 152 L232 112 H322 L362 152 Z" fill="#f5c400"/>
    <path d="M206 150 L236 120 H274 V150 Z" fill="#16181d" opacity=".85"/>
    <path d="M282 120 H318 L348 150 H282 Z" fill="#16181d" opacity=".85"/>
    <rect x="130" y="148" width="280" height="62" rx="16" fill="#f5c400"/>
    <rect x="130" y="186" width="280" height="10" fill="#ddb000"/>
    <path d="M278 152 V206" stroke="#c99f00" stroke-width="2"/>
    <rect x="290" y="164" width="18" height="5" rx="2" fill="#16181d"/>
    <rect x="232" y="164" width="18" height="5" rx="2" fill="#16181d"/>
    <!-- farol e lanterna -->
    <rect class="pisca" x="396" y="160" width="14" height="12" rx="3" fill="#fff6c2"/>
    <rect x="130" y="160" width="10" height="12" rx="3" fill="#e5484d"/>
    <!-- para-choques -->
    <rect x="404" y="194" width="14" height="12" rx="4" fill="#16181d"/>
    <rect x="122" y="194" width="14" height="12" rx="4" fill="#16181d"/>
    <!-- logo V na porta -->
    <path d="M226 168 h8 l5 16 l5 -16 h8 l-9 24 h-8 z" fill="#16181d"/>
    <!-- roda traseira -->
    <circle cx="196" cy="214" r="30" fill="#16181d"/>
    <circle cx="196" cy="214" r="14" fill="#b4b8c0"/>
    <circle cx="196" cy="214" r="5" fill="#16181d"/>
    <!-- caixa de roda dianteira vazia -->
    <path d="M318 210 a32 32 0 0 1 64 0 Z" fill="#16181d"/>
    <!-- fumaça do capô -->
    <g class="fumaca" fill="#b4b8c0">
      <circle cx="384" cy="140" r="14"/>
      <circle cx="396" cy="146" r="11"/>
      <circle cx="376" cy="148" r="12"/>
    </g>
  </g>

  <!-- a roda que fugiu -->
  <g class="roda-solta">
    <g class="gira">
      <circle cx="350" cy="222" r="30" fill="#16181d"/>
      <circle cx="350" cy="222" r="14" fill="#b4b8c0"/>
      <rect x="347" y="200" width="6" height="44" fill="#16181d"/>
      <circle cx="350" cy="222" r="5" fill="#16181d"/>
    </g>
  </g>
</svg>
